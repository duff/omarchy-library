name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: duff/omarchy-kitchen
          ref: v0.2.0
          path: kitchen
      - run: test/run
        env:
          KITCHEN_DIR: kitchen
